<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icon-192.png">
    <title>MixerSmash</title>
    <script src="wasm-meta.js"></script>
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overscroll-behavior: none;
            touch-action: none;
        }

        body {
            position: fixed;
            inset: 0;
            overflow: hidden;
            background: #000;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        * {
            touch-action: none;
            overscroll-behavior: none;
            -webkit-user-select: none;
            user-select: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
            touch-action: none;
        }

        #loading {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2rem;
        }

        #loading img {
            max-width: 80vw;
            height: auto;
            display: block;
        }

        #progress-container {
            width: 80vw;
            max-width: 480px;
            height: 12px;
            background: #333;
            border-radius: 6px;
            overflow: hidden;
        }

        #progress-fill {
            height: 100%;
            width: 0%;
            background: #fff;
            border-radius: 6px;
            transition: width 0.1s linear;
        }

        #startbtn {
            display: none;
            padding: 1.2rem 3rem;
            font-size: 1.6rem;
            font-family: sans-serif;
            font-weight: bold;
            color: #000;
            background: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
        }

        #load-error {
            display: none;
            color: #f66;
            font-family: sans-serif;
            font-size: 1rem;
            text-align: center;
            padding: 0 1rem;
        }
    </style>
</head>
<body>
    <div id="loading">
        <img src="title.png" alt="MixerSmash">
        <div id="progress-container">
            <div id="progress-fill"></div>
        </div>
        <button id="startbtn">Start</button>
        <div id="load-error"></div>
    </div>

    <script src="wasm_exec.js"></script>
    <script>
        // Prevent pull-to-refresh and rubber-band scrolling on iOS and Android.
        document.addEventListener('touchmove', function(e) { e.preventDefault(); }, {passive: false});

        // Enter fullscreen on each user gesture until it actually takes, then detach.
        // orientation.lock is sequenced inside the fullscreen promise so it fires after
        // the fullscreen transition completes (required on Android). Lock rejections are
        // swallowed because iOS and desktop do not support it.
        // Does NOT preventDefault — the tap still reaches the game.
        function enterImmersive() {
            if (document.fullscreenElement) return;
            var el = document.documentElement;
            var p;
            try { p = el.requestFullscreen ? el.requestFullscreen() : null; } catch (e) { p = null; }
            if (p && p.then) {
                p.then(function () {
                    try {
                        if (screen.orientation && screen.orientation.lock) {
                            screen.orientation.lock('landscape').catch(function () {});
                        }
                    } catch (e) {}
                }).catch(function () {});
            }
        }
        function onGesture() {
            enterImmersive();
            if (document.fullscreenElement) {
                window.removeEventListener('pointerdown', onGesture, true);
                window.removeEventListener('touchend', onGesture, true);
                window.removeEventListener('click', onGesture, true);
            }
        }
        window.addEventListener('pointerdown', onGesture, true);
        window.addEventListener('touchend', onGesture, true);
        window.addEventListener('click', onGesture, true);

        // Fallback estimate for WASM size when wasm-meta.js is absent
        // (e.g. opening index.html without running `make wasm` first).
        var WASM_EST = 22 * 1024 * 1024;

        // Use the exact uncompressed size emitted at build time when available.
        // window.MIXERSMASH_WASM_SIZE is set by wasm-meta.js (generated by `make wasm`).
        var WASM_TOTAL = (typeof window.MIXERSMASH_WASM_SIZE === 'number' && window.MIXERSMASH_WASM_SIZE > 0)
            ? window.MIXERSMASH_WASM_SIZE
            : WASM_EST;

        var progressFill = document.getElementById('progress-fill');
        var progressContainer = document.getElementById('progress-container');
        var startBtn = document.getElementById('startbtn');
        var loadError = document.getElementById('load-error');

        function setProgress(pct) {
            var clamped = Math.max(0, Math.min(100, pct));
            progressFill.style.width = clamped + '%';
        }

        function showStartButton() {
            progressContainer.style.display = 'none';
            startBtn.style.display = 'block';
        }

        function showError(msg) {
            progressContainer.style.display = 'none';
            startBtn.style.display = 'none';
            loadError.style.display = 'block';
            loadError.textContent = msg;
        }

        startBtn.addEventListener('click', function () {
            enterImmersive();
            document.getElementById('loading').style.display = 'none';
        });

        (async function () {
            const go = new Go();

            try {
                const resp = await fetch('mixersmash.wasm');
                if (!resp.ok) {
                    throw new Error('Fetch failed: ' + resp.status + ' ' + resp.statusText);
                }

                // The ReadableStream yields decompressed bytes, and WASM_TOTAL is the
                // uncompressed file size from wasm-meta.js — so the ratio is exact.
                var total = WASM_TOTAL;

                var reader = resp.body.getReader();
                var chunks = [];
                var received = 0;

                while (true) {
                    var read = await reader.read();
                    if (read.done) break;
                    chunks.push(read.value);
                    received += read.value.byteLength;
                    setProgress(received / total * 100);
                }

                // Concatenate all chunks into a single Uint8Array.
                var bytes = new Uint8Array(received);
                var offset = 0;
                for (var i = 0; i < chunks.length; i++) {
                    bytes.set(chunks[i], offset);
                    offset += chunks[i].byteLength;
                }

                setProgress(100);

                var result = await WebAssembly.instantiate(bytes, go.importObject);
                go.run(result.instance);

                showStartButton();
            } catch (err) {
                console.error('Failed to load mixersmash.wasm:', err);
                showError('Failed to load game: ' + err.message);
            }
        })();
    </script>
</body>
</html>
