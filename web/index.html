<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icon-192.png">
    <title>MixerSmash</title>
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overscroll-behavior: none;
            touch-action: none;
        }

        body {
            position: fixed;
            inset: 0;
            overflow: hidden;
            background: #000;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        * {
            touch-action: none;
            overscroll-behavior: none;
            -webkit-user-select: none;
            user-select: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
            touch-action: none;
        }
    </style>
</head>
<body>
    <div id="loading" style="display:none; position:fixed; bottom:1rem; right:1rem; color:#fff; font-family:sans-serif; z-index:35;">Loading&hellip;</div>

    <script src="wasm_exec.js"></script>
    <script>
        // Prevent pull-to-refresh and rubber-band scrolling on iOS and Android.
        document.addEventListener('touchmove', function(e) { e.preventDefault(); }, {passive: false});

        // Enter fullscreen on each user gesture until it actually takes, then detach.
        // orientation.lock is sequenced inside the fullscreen promise so it fires after
        // the fullscreen transition completes (required on Android). Lock rejections are
        // swallowed because iOS and desktop do not support it.
        // Does NOT preventDefault — the tap still reaches the game.
        function enterImmersive() {
            if (document.fullscreenElement) return;
            var el = document.documentElement;
            var p;
            try { p = el.requestFullscreen ? el.requestFullscreen() : null; } catch (e) { p = null; }
            if (p && p.then) {
                p.then(function () {
                    try {
                        if (screen.orientation && screen.orientation.lock) {
                            screen.orientation.lock('landscape').catch(function () {});
                        }
                    } catch (e) {}
                }).catch(function () {});
            }
        }
        function onGesture() {
            enterImmersive();
            if (document.fullscreenElement) {
                window.removeEventListener('pointerdown', onGesture, true);
                window.removeEventListener('touchend', onGesture, true);
                window.removeEventListener('click', onGesture, true);
            }
        }
        window.addEventListener('pointerdown', onGesture, true);
        window.addEventListener('touchend', onGesture, true);
        window.addEventListener('click', onGesture, true);

        (async function () {
            const go = new Go();

            async function loadWasm() {
                // Prefer streaming instantiation (requires correct MIME type: application/wasm).
                // Fall back to ArrayBuffer instantiation for servers that serve .wasm as
                // application/octet-stream or similar (common with simple static servers).
                if (typeof WebAssembly.instantiateStreaming === "function") {
                    try {
                        const result = await WebAssembly.instantiateStreaming(
                            fetch("mixersmash.wasm"),
                            go.importObject
                        );
                        return result;
                    } catch (streamErr) {
                        console.warn(
                            "WebAssembly.instantiateStreaming failed, falling back to ArrayBuffer instantiation:",
                            streamErr
                        );
                    }
                }

                // ArrayBuffer fallback.
                const resp = await fetch("mixersmash.wasm");
                const bytes = await resp.arrayBuffer();
                return WebAssembly.instantiate(bytes, go.importObject);
            }

            const t0 = performance.now();
            let loaded = false;
            setTimeout(function () {
                if (!loaded) {
                    document.getElementById('loading').style.display = 'block';
                }
            }, 1000);

            try {
                const result = await loadWasm();
                loaded = true;
                document.getElementById('loading').style.display = 'none';
                go.run(result.instance);
            } catch (err) {
                loaded = true;
                document.getElementById('loading').style.display = 'none';
                console.error("Failed to load mixersmash.wasm:", err);
            }
        })();
    </script>
</body>
</html>
